[workspace]
members = [
    "crates/pg-framework-cache",
    "crates/pg-framework-core",
    "crates/pg-framework-discovery",
    "crates/pg-framework-integration-tests",
    "crates/pg-framework-lock",
    "crates/pg-framework-ratelimit",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
pg-framework-core = { path = "crates/pg-framework-core" }
pg-framework-cache = { path = "crates/pg-framework-cache" }
pg-framework-discovery = { path = "crates/pg-framework-discovery" }
pg-framework-lock = { path = "crates/pg-framework-lock" }
pg-framework-ratelimit = { path = "crates/pg-framework-ratelimit" }
deadpool-postgres = "0.14"
getrandom = "0.4"
hmac = "0.13"
sha2 = "0.11"
thiserror = "2.0"
tokio = { version = "1.54", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tokio-postgres = "0.7"
tracing = "0.1"
